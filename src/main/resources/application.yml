spring:
  application:
    name: ${APP_NAME:UniFlow Academic Service}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:uniflow_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: academic
    default-schema: academic
    create-schemas: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}

app:
  security:
    cognito:
      allowed-client-ids: ${COGNITO_ALLOWED_CLIENT_IDS:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

reminder:
  scheduler: ${REMINDER_SCHEDULER:noop}
  group-name: ${REMINDER_GROUP_NAME:default}
  queue-arn: ${REMINDER_QUEUE_ARN:}
  role-arn: ${REMINDER_ROLE_ARN:}
  lead-time-hours: ${REMINDER_LEAD_TIME_HOURS:24}
  api-timeout: ${REMINDER_API_TIMEOUT:5s}
  api-attempt-timeout: ${REMINDER_API_ATTEMPT_TIMEOUT:2s}
  max-retries: ${REMINDER_MAX_RETRIES:2}
  connect-timeout: ${REMINDER_CONNECT_TIMEOUT:1s}
  socket-timeout: ${REMINDER_SOCKET_TIMEOUT:2s}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.uniflow: ${LOGGING_LEVEL_COM_UNIFLOW:INFO}
    org.hibernate.SQL: ${LOGGING_LEVEL_ORG_HIBERNATE_SQL:OFF}
    org.flywaydb.core: INFO

springdoc:
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
